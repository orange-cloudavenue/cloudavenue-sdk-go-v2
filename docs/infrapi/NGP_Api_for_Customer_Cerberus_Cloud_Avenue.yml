      x-compatibility:
      - NGP
      - CERBERUS_NGP
      - NGP_API_FOR_CUSTOMER
      - CERBERUS_NGP_API_FOR_CUSTOMER
      summary: Add network connectivity
      description: Add newtwork connectivity to your organization. Please look at
        examples to know which network types are available and how to configure them.
      operationId: addNetworkConnectivity
      tags:
      - Network & connectivity
      security:
      - Cerberus: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/network_schema'
            examples:
              EIN:
                description: Add EIN network. This type of network is only available
                  for Orange internal organizations.
                value:
                  networkType: ein
                  tier0Name: prvrf01eocb1010311allsp02
              INTERNET:
                description: 'Add internet network. This network type will configure
                  connectivity to internet and assign a public IP to the given edge
                  gateway.<br>

                  Properties key is optional.<br>

                  You can define ip if you already have this ip configured on a linked
                  organization.<br>

                  Announced property allows you to enable or disable access from and
                  to this public IP.<br>

                  '
                value:
                  networkType: internet
                  edgeGateway: ded5e363-1075-488c-9d72-9f91a8835bbb
                  properties:
                    ip: 11.12.13.14
                    announced: true
              BVPN:
                description: Add bvpn network. This network type configure BVPN connectivity
