servers:
- url: https://api1.cloudavenue.orange-business.com
- url: https://api1.cloudavenue-vdr.itn.intraorange
security: []
components:
  securitySchemes:
    Cerberus:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api1.cloudavenue.orange-business.com/auth/v1/user/token
          scopes: {}
  responses:
    JobCreated:
      description: Job created
      headers:
        X-Automation-Job-Id:
          schema:
            type: string
            format: uuid
          description: Job-Id used in jobs management requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/jobcreated'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    Conflict:
      description: There is an other job pending for this organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiError'
    CerberusError:
      description: An error occured on proxy side
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CerberusError'
    CerberusAuthentResponse:
      description: Authentication response containing access_token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CerberusAuthentResponse'
  schemas:
    organization_v2:
      properties:
        name:
          $ref: '#/components/schemas/organizationNameV2'
        fullName:
          type: string
          example: Example Full Name
          description: Full name of the organization
        description:
          type: string
          example: Organization made for testing purposes
          description: Description of the organization
        isSuspended:
          type: boolean
          default: false
          example: true
          description: In case of change, customer VM are activated or deactivated
        isEnabled:
          type: boolean
          default: true
          example: true
          description: Enable organization if True
        customerMail:
          type: string
          example: example@company.com
        internetBillingMode:
          $ref: '#/components/schemas/internetBillingMode'
    organization_v2_put:
      allOf:
      - $ref: '#/components/schemas/organization_v2'
    organization_v2_get:
      required:
      - name
      - fullName
      - description
      - isEnabled
      - isSuspended
      - customerMail
      - internetBillingMode
      allOf:
      - $ref: '#/components/schemas/organization_v2'
    customerInformation:
      required:
      - customerType
      - bssServiceId
      - customerName
      properties:
        bssServiceId:
          type: string
          example: OCB1234567
        customerName:
          type: string
          example: Example Name
        customerType:
          $ref: '#/components/schemas/customerType'
    customerType:
      type: string
      enum:
      - INTERNAL
      - EXTERNAL
      - NGP-INTERNAL
      - NGP-OFR
      - NGP-EXTERNAL
      - NGP-MNP
      example: NGP-EXTERNAL
    identityProvider:
      type: string
      enum:
      - local
      - siu
      - guardian
      example: siu
    siteCode:
      type: string
      enum:
      - VDR
      - RM
      - FR4
      - CHA
      - SIN
      - MUM
      - ATL
      example: VDR
      description: Site where the resource is located
    internetBillingMode:
      type: string
      enum:
      - PAYG
      - TRAFFIC_VOLUME
      example: PAYG
    orgUsers:
      type: array
      items:
        $ref: '#/components/schemas/orgUser'
    orgUser:
      type: object
      required:
      - login
      - providerId
      - providerType
      properties:
        login:
          type: string
          example: CVNN4456
          description: User login in vCloud Director
        providerId:
          type: string
          description: User identifier provided by the Identify Provider. ie. local
            => uuid; siu => siu-id
        providerType:
          type: string
          example: local
          enum:
          - local
          - siu
          - guardian
        role:
          type: string
          enum:
          - Organization Administrator
          - Catalog Author
          - vApp Author
          - vApp User
          - Console Access Only
          default: Organization Administrator
        emailAddress:
          type: string
          example: noreply@orange.com
          default: ''
        fullName:
          type: string
          example: ''
          default: ''
        isEnabled:
          type: boolean
          example: true
          default: true
        telephone:
          type: string
          example: ''
          default: ''
    orgUserRecord:
      type: object
      properties:
        login:
          type: string
          example: CVNN4456
          description: User login in vCloud Director
        providerType:
          type: string
          example: local
          enum:
          - local
          - siu
          - guardian
        fullName:
          type: string
          example: Full Name
          default: ''
        isEnabled:
          type: boolean
          example: true
          default: true
    storages:
      type: array
      items:
        type: object
        required:
        - name
        properties:
          name:
            type: string
            example: SILVERZ_CUST1
            description: Name of the storage policy usable in a storage profile.
    orgVdcs:
      type: array
      items:
        type: object
        required:
        - name
        - vdcServiceClass
        - vdcDisponibilityClass
        - vdcBillingModel
        - vdcStorageBillingModel
        - vdcStorageProfiles
        - cpuAllocated
        - memoryAllocated
        properties:
          id:
            type: string
            example: a90baf04-7464-4631-98af-cd86077feb13
            description: VMware unique ID. There is no ID in the body of the POST
              request, as VMware which generates it. This ID must be present for GET
              and PUT.
          name:
            type: string
            example: VDC_BENCH_AP
            description: Name of the new org vdc.
            minLength: 2
            maxLength: 27
            pattern: ^\w{2,27}$
          description:
            type: string
            example: Additionnal VDC for benchmarks
            description: Description of the new org vdc.
          isEnabled:
            type: boolean
            example: true
            default: true
          vdcServiceClass:
            type: string
            enum:
            - ECO
            - STD
            - HP
            - VOIP
            description: SILVER, GOLD and PLATINUM_3K storage types are available
              for all classes. PLATINUM_5K and PLATINUM_10K are available only for
              STD (Standard), HP (High Performance) and VOIP (VoIP).
          vdcDisponibilityClass:
            type: string
            example: ONE-ROOM
            enum:
            - ONE-ROOM
            - DUAL-ROOM
            description: Allocation model used by this vdc. DUAL-ROOM isn't available
              for vdcServiceClass ECO.
          vdcBillingModel:
            type: string
            description: Choose Billing model of storage resources. PAYG and DRAAS
              only available for vdcServiceClass ECO and STD.
            enum:
            - PAYG
            - DRAAS
            - MIXED
            - RESERVED
            - DEDICATED
          vdcStorageBillingModel:
            type: string
            enum:
            - PAYG
            - RESERVED
            description: Available for all vdcServiceClass.
          nicQuota:
            type: number
            example: 0
            description: Maximum number of virtual NICs allowed in this vdc. Defaults
              to 0, which specifies an unlimited number.
            default: 0
          networkQuota:
            type: number
            example: 1000
            description: Maximum number of network objects that can be deployed in
              this vdc. Defaults to 0, which means no networks can be deployed.
            default: 0
          vmQuota:
            type: number
            example: 0
            default: 0
            description: Maximum number of VMs that can be created in this vdc. Defaults
              to 0, which specifies an unlimited number.
          vcpuInMhz2:
            type: number
            example: 2300
            default: 2300
            minimum: 1000
            description: Specifies the clock frequency, in Mhz, for any virtual CPU
              that is allocated to a VM.
          cpuAllocated:
            type: number
            example: 100000
            minimum: 5000
            maximum: 1000000
            description: Capacity that is committed to be available or used as a limit
              in PAYG mode. Unit for compute capacity allocated to this vdc is MHz.
              Note. Reserved capacity is automatically set according to the service
              class.
          memoryAllocated:
            type: number
            example: 72
            minimum: 10
            maximum: 1000
            description: Memory capacity that is committed to be available or used
              as a limit in PAYG mode. Unit for memory capacity allocated to this
              vdc is Gb.
          vdcStorageProfiles:
            $ref: '#/components/schemas/vdcStorageProfiles'
          vdcEdges:
            $ref: '#/components/schemas/vdcEdges'
    storageProfile:
      type: object
      required:
      - name
      - limit
      properties:
        id:
          type: string
          example: a90baf04-7464-4631-98af-cd86077feb13
          description: VMware unique ID. There is no ID in the body of the POST request,
            as VMware which generates it. This ID must be present for GET and PUT.
        name:
          type: string
          enum:
          - SILVER
          - GOLD
          - PLATINUM_3K
          - PLATINUM_5K
          - PLATINUM_10K
        limit:
          description: Max number of units allocated for this storage profile. In
            Gb
          type: integer
          example: 5000
          minimum: 500
          maximum: 50000
          default: 2000
        used:
          description: Current usage of this StorageProfile in Gb. Deletion is allowed
            only if there is no usage of the StorageProfile
          type: integer
          example: 5000
          minimum: 0
        default:
          type: boolean
          example: true
          enum:
          - true
          - false
    vdcStorageProfiles:
      description: List of provider vdc storage profiles to add to this vdc.
      type: array
      items:
        $ref: '#/components/schemas/storageProfile'
    action:
      required:
      - name
      - status
      - details
      properties:
        name:
          type: string
          enum:
          - CREATE_VORG
          - DELETE_VORG
          - MODIFY_VDC_RESOURCES
          - CREATE_VDC
        status:
          type: string
          enum:
          - CREATED
          - PENDING
          - IN_PROGRESS
          - FAILED
          - DONE
        details:
          type: string
          description: Human-readable action description
      type: object
    parentJob_metadata:
      required:
      - description
      - name
      - status
      properties:
        actions:
          type: array
          items:
