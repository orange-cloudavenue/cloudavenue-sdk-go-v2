    vdcStorageProfilesV2:
      required:
      - class
      - limit
      - default
      description: Storage policies description
      type: object
      properties:
        class:
          type: string
          description: 'The value can be on this model for dedicated ''platinum3k_ocb1234567_hm''
            (dedicated storage is only available with GET route, it is not possible
            to update or create a VDC with dedicated storage) or one of these values
            : silver,silver_r1,silver_r2, gold,gold_r1,gold_r2, gold_hm, platinum3k,platinum3k_r1,platinum3k_r2,
            platinum3k_hm, platinum7k,platinum7k_r1,platinum7k_r2, platinum7k_hm'
          default: gold
        limit:
          description: Max number of units allocated for this storage profile. In
            GiB
          type: integer
          example: 500
          minimum: 100
          maximum: 81920
          default: 500
        used:
          description: Current usage of this StorageProfile in GiB. Deletion is allowed
            only if there is no usage of the StorageProfile
          type: integer
          example: 5000
          minimum: 0
        default:
          description: True if the storage Profile is the default one. Only one default
            per vdc is allowed.
          type: boolean
          example: true
    orgVdcV2:
      type: object
      required:
      - name
      - vdcServiceClass
      - vdcDisponibilityClass
      - vdcBillingModel
      - vdcStorageBillingModel
      - vdcStorageProfiles
      - cpuAllocated
      - vcpuInMhz2
      - memoryAllocated
      properties:
        name:
          type: string
          example: VDC_ECO_1
          description: Name of the new org vdc.
          minLength: 2
          maxLength: 27
          pattern: ^\w{2,27}$
        description:
          type: string
          example: Additionnal VDC for benchmarks
          description: Description of the new org vdc.
        vdcServiceClass:
          type: string
          example: ECO
          enum:
          - ECO
          - STD
          - HP
          - VOIP
        vdcDisponibilityClass:
          type: string
          example: ONE-ROOM
          enum:
          - ONE-ROOM
          - DUAL-ROOM
          - HA-DUAL-ROOM
        vdcBillingModel:
          type: string
          description: Choose Billing model of compute resources.
          enum:
          - PAYG
          - DRAAS
          - RESERVED
        vcpuInMhz2:
          type: number
          example: 2200
          default: 2200
          minimum: 1200
          description: Specifies the clock frequency, in Mhz, for any virtual CPU
            that is allocated to a VM.
        cpuAllocated:
          type: number
          example: 11000
          minimum: 5
          maximum: 2500000
          description: Capacity that is committed to be available or used as a limit
            in PAYG mode. Unit for compute capacity allocated to this vdc is MHz.
            Note. Reserved capacity is automatically set according to the service
            class.
        memoryAllocated:
          type: number
          example: 4
          minimum: 1
          maximum: 5000
          description: Memory capacity that is committed to be available or used as
            a limit in PAYG mode. Unit for memory capacity allocated to this vdc is
            Gb.
        vdcStorageBillingModel:
          title: Storage billing model
          type: string
          enum:
          - PAYG
          - RESERVED
          description: Available for all vdcServiceClass.
        vdcStorageProfiles:
          type: array
          items:
            $ref: '#/components/schemas/vdcStorageProfilesV2'
