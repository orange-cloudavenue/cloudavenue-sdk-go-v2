openapi: 3.0.0
info:
  title: Cloud Avenue API
  description: "Cloud Avenue API allows you to create and manage resources on your\
    \ infrastructure.\n\n## Authentication\n\nIn order to authenticate to this API,\
    \ you must first authenticate by clicking on the \"Authorize\" button and fill\
    \ the required parameters:\n- client_id: your username\n- client_secret: your\
    \ password\n- organization: the organization holding your user\n\n Servers purpose:\
    \ \n- https://api1.cloudavenue.orange-business.com: this server is intended to\
    \ be used from internet \n- https://api1.cloudavenue-vdr.itn.intraorange: this\
    \ server is intended to be used from inside orange internal network\n\nOnce done,\
    \ click on the \"Authorize\" button, close the authentication modal and start\
    \ using the API!"
  version: 2.0.0
tags:
- name: Authentication
  description: Authentication method
paths:
  /auth/v1/user/token:
    post:
      x-compatibility:
      - CERBERUS_NGP_API_FOR_CUSTOMER
      summary: Authentication to Cerberus.
      tags:
      - Authentication
      requestBody:
        description: Authentication
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CerberusAuthentRequest'
      responses:
        '200':
          $ref: '#/components/responses/CerberusAuthentResponse'
        '500':
          $ref: '#/components/responses/CerberusError'
        '404':
          $ref: '#/components/responses/CerberusError'
      parameters: []
  /infrapicustomerproxy/v1.0/federate:
